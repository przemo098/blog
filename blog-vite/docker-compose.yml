services:
  blog:
    build: .
    ports:
      - "7777:7777"
    restart: unless-stopped
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull qwen2.5:3b && wait"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          memory: 512M
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config.yml:/etc/cloudflared/config.yml:ro
      - ${CLOUDFLARED_CREDS:-C:/Users/Charman/.cloudflared/7350987f-fbcf-4e8c-ac5e-e26cc709fb42.json}:/etc/cloudflared/7350987f-fbcf-4e8c-ac5e-e26cc709fb42.json:ro
    restart: unless-stopped
    depends_on:
      - blog
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  ollama_data:
